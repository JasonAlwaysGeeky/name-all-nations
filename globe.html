<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c4b7a">
  <title>Globe experiment — Name All Nations</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* The experiment's own chrome. Everything that decides how the globe
       looks lives in css/style.css with the flat map's, so the two are
       being judged on the same palette. */
    body { display: flex; flex-direction: column; }
    #globe-wrap {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 50% 8%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 55%),
        linear-gradient(180deg, #d9e8f3, #9dbdd8);
    }
    #globe { position: absolute; inset: 0; touch-action: none; cursor: grab; display: block; }
    #globe.turning { cursor: grabbing; }
    #pick { display: none; }

    #hud {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      width: min(760px, calc(100% - 24px));
      background: var(--panel-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 11px 14px;
      z-index: 5;
    }
    #hud[hidden] { display: none; }
    #readout { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
    #fps {
      margin-top: 4px;
      font: 600 0.74rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--ink-soft);
    }
    .hud-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .hud-row label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-soft); }
    #back {
      position: absolute;
      left: 14px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 650;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-sm);
    }
    #note {
      position: absolute;
      right: 14px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      z-index: 6;
      max-width: 240px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: #16324c;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 10px;
      padding: 8px 11px;
      box-shadow: var(--shadow-sm);
    }
    @media (max-width: 640px) { #note { display: none; } }
  </style>
</head>
<body>

  <div id="globe-wrap">
    <canvas id="globe"></canvas>
    <canvas id="pick"></canvas>

    <a id="back" href="index.html">‹ back to the game</a>

    <p id="note">
      Experiment, not a mode yet: this draws the real borders as a globe and
      shows what each frame costs. Drag to turn it, scroll or pinch to zoom,
      click a country to name it. Nothing here is scored.
    </p>

    <div id="hud" hidden>
      <div id="readout">loading the map…</div>
      <div id="fps"></div>
      <div class="hud-row">
        <label><input type="checkbox" id="detail"> fine borders (normally automatic, on settle)</label>
        <label><input type="checkbox" id="grid" checked> graticule</label>
        <label><input type="checkbox" id="spin-toggle"> spin (a steady worst case for the frame counter)</label>
      </div>
    </div>
  </div>

  <script src="js/countries.js"></script>
  <script src="js/globe.js"></script>
</body>
</html>
