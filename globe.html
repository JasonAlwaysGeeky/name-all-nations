<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c1522">
  <title>Globe — Name All Nations</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* The globe's own chrome. Everything the game puts on screen — the
       jump row, the card, the find bar, the pops — is the flat map's
       markup under the flat map's stylesheet, so the two are judged on
       the same furniture. */
    body { display: flex; flex-direction: column; }
    #globe-wrap {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      background: var(--color-bg);
    }
    #globe { position: absolute; inset: 0; touch-action: none; cursor: grab; display: block; }
    #globe.turning { cursor: grabbing; }
    #pick { display: none; }

    /* the way back to the flat map, at the end of the HUD */
    #back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--color-neutral-300);
      border-radius: var(--radius-md);
    }
    #back:hover { background: var(--color-neutral-900); color: var(--ink); }
    #level-mode { padding: 5px 10px; margin: 0 4px; }
    /* what each frame costs, for the experiment's sake */
    #fps {
      position: absolute;
      right: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      z-index: 6;
      max-width: 38vw;
      font: 500 0.64rem var(--font-mono);
      color: var(--ink-faint);
      background: var(--panel-bg);
      box-shadow: var(--shadow-sm);
      border-radius: 8px;
      padding: 5px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 640px) { #fps { display: none; } }

  </style>
</head>
<body>

  <div id="globe-wrap">
    <canvas id="globe"></canvas>
    <canvas id="pick"></canvas>

    <div id="fps"></div>

    <div id="level-banner">
      <button id="progress-wrap" title="Next challenge">
        <svg class="ic" aria-hidden="true"><use href="icons/ph.svg#globe-hemisphere-west"/></svg><span id="level-title">The whole world</span><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#caret-right"/></svg>
      </button>
      <button id="level-mode" title="Switch mode">Place</button>
      <span class="hud-rule"></span>
      <span id="progress-text">0 / 195</span>
      <a id="back" href="index.html" title="Back to the flat map"><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#caret-left"/></svg>Flat map</a>
    </div>

    <!-- the minimap: six zones, one per jump key (globe-play.js) -->
    <nav id="jump-bar" aria-label="Jump around the globe">
      <div id="mini">
        <svg id="mini-map" viewBox="0 0 1010 666" aria-hidden="true"><path id="mini-terr"/><path id="mini-land"/></svg>
        <button data-key="1" data-area="N. America" data-pocket="Central America" style="left:0;top:0;width:35.64%;height:63.81%"><kbd>1</kbd><span class="jump-to">N. America</span></button>
        <button data-key="q" data-area="S. America" data-pocket="Caribbean" style="left:14.85%;top:63.81%;width:23.27%;height:36.19%"><kbd>Q</kbd><span class="jump-to">S. America</span></button>
        <button data-key="2" data-area="Europe" data-pocket="Micro-states" style="left:38.12%;top:15.02%;width:20.3%;height:39.79%"><kbd>2</kbd><span class="jump-to">Europe</span></button>
        <button data-key="w" data-area="Africa" data-pocket="West coast" style="left:40.1%;top:54.8%;width:22.28%;height:42.04%"><kbd>W</kbd><span class="jump-to">Africa</span></button>
        <button data-key="3" data-area="Asia" data-pocket="Middle East" style="left:58.42%;top:15.02%;width:41.58%;height:45.05%"><kbd>3</kbd><span class="jump-to">Asia</span></button>
        <button data-key="e" data-area="South Asia" data-pocket="Pacific isles" style="left:63.37%;top:60.06%;width:36.63%;height:39.94%"><kbd>E</kbd><span class="jump-to">South Asia</span></button>
      </div>
    </nav>

    <section id="card" class="dock" hidden>
      <div class="dock-above"><p id="feedback" role="status"></p></div>
      <div id="card-question">
        <form id="guess-form" autocomplete="off">
          <input id="guess-input" type="text" autocomplete="off" autocapitalize="words"
                 spellcheck="false" placeholder="Name the highlighted nation, then Enter" aria-label="Nation name guess">
          <span id="card-actions">
            <button type="button" id="reveal-btn" title="Reveal" aria-label="Reveal"><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#eye"/></svg></button>
          </span>
          <button type="submit" id="guess-btn" title="Guess (Enter)" aria-label="Guess"><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#arrow-right"/></svg></button>
        </form>
      </div>
      <div id="card-answer" hidden>
        <h2 id="answer-name"></h2>
        <p id="answer-result"></p>
      </div>
      <button id="card-close" title="Close (Esc)" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#x"/></svg></button>
    </section>

    <section id="word-bank" class="dock" hidden>
      <div id="bank-above" class="dock-above">
        <div id="bank-chips"></div>
        <p id="bank-hint"></p>
      </div>
      <div id="bank-target">
        <span id="bank-flag"></span>
        <strong id="bank-name"></strong>
        <span id="bank-strikes" aria-label="Wrong tries"></span>
        <span class="bank-buttons">
          <button id="bank-skip" title="Skip for now (Space)" aria-label="Skip"><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#skip-forward"/></svg><span class="lbl">Skip <kbd>Space</kbd></span></button>
          <button id="bank-show" title="Show me where it is (counts as a miss)" aria-label="Show me"><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#eye"/></svg><span class="lbl">Show me</span></button>
          <button id="bank-collapse" title="Show / hide the list" aria-label="Toggle list"><svg class="ic" aria-hidden="true"><use href="icons/ph.svg#caret-up"/></svg></button>
        </span>
      </div>
    </section>
  </div>

  <script src="js/countries.js"></script>
  <script src="js/targets.js"></script>
  <script src="js/views.js"></script>
  <script src="js/names.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/islands.js"></script>
  <script src="js/globe.js"></script>
  <script src="js/globe-play.js"></script>
</body>
</html>
